<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Horas Adicionales - CAP</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --cap-blue: #003366; --cap-gold: #c5a059; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        .header-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .header-table td { border: 1px solid #000; padding: 5px; font-weight: bold; background: #f8f9fa; }
        .main-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .main-table th, .main-table td { border: 1px solid #000; padding: 8px; text-align: left; }
        .main-table th { background: #e9ecef; font-size: 0.9rem; }
        input { width: 100%; border: none; outline: none; background: transparent; font-size: 1rem; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; margin: 5px; }
        .btn-add { background: #28a745; }
        .btn-send { background: var(--cap-blue); width: 100%; margin-top: 20px; font-size: 1.1rem; }
        .total-row { background: #eee; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; color: var(--cap-blue);">Horas adicionales</h2>
    
    <table class="header-table">
        <tr>
            <td>Nombre:</td>
            <td><input type="text" id="nombreEmp" placeholder="Nombre Completo"></td>
            <td>No. de empleado:</td>
            <td><input type="text" id="idEmp" placeholder="P000"></td>
        </tr>
        <tr>
            <td>Correo:</td>
            <td colspan="3"><input type="email" id="correoEmp" placeholder="usuario@cap.edu.mx"></td>
        </tr>
    </table>

    <table class="main-table" id="tablaActividades">
        <thead>
            <tr>
                <th style="width: 20%;">Fecha</th>
                <th style="width: 15%;">Tiempo (hrs):</th>
                <th style="width: 65%;">Actividad:</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <tr>
                <td><input type="date" class="row-fecha"></td>
                <td><input type="number" class="row-horas" oninput="calcularTotal()" step="0.5"></td>
                <td><input type="text" class="row-act"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td>Total</td>
                <td id="totalHoras">0</td>
                <td></td>
            </tr>
        </tfoot>
    </table>

    <button class="btn btn-add" onclick="agregarFila()">+ Añadir día / fila</button>
    <button class="btn btn-send" onclick="enviarReporteCompleto()">ENVIAR REPORTE QUINCENAL</button>
    
    <hr>
    <button class="btn" style="background:#6c757d; font-size:0.8rem;" onclick="accesoSupervisor()">Panel Supervisor</button>
</div>

<div id="view-admin" class="card hidden" style="margin-top:20px;">
    <h3>Reportes Recibidos</h3>
    <div id="lista-reportes"></div>
    <button class="btn" style="background:#dc3545" onclick="location.reload()">Cerrar</button>
</div>

<script>
    // --- PEGA TUS DATOS DE FIREBASE AQUÍ ---
    const firebaseConfig = {
        apiKey: "AIzaSyA8kdp8RqrgCPiCCpAQw3Zp06-zLtHsIdU",
        authDomain: "horasadicionales-seccap.firebaseapp.com",
        projectId: "horasadicionales-seccap",
        storageBucket: "horasadicionales-seccap.firebasestorage.app",
        messagingSenderId: "775098466986",
        appId: "1:775098466986:web:5eda0508046d1dbf2086d3",
        measurementId: "G-PNZE1CNG8D"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function agregarFila() {
        const tbody = document.getElementById('cuerpoTabla');
        const nuevaFila = document.createElement('tr');
        nuevaFila.innerHTML = `
            <td><input type="date" class="row-fecha"></td>
            <td><input type="number" class="row-horas" oninput="calcularTotal()" step="0.5"></td>
            <td><input type="text" class="row-act"></td>
        `;
        tbody.appendChild(nuevaFila);
    }

    function calcularTotal() {
        let suma = 0;
        document.querySelectorAll('.row-horas').forEach(input => {
            suma += parseFloat(input.value) || 0;
        });
        document.getElementById('totalHoras').innerText = suma;
    }

    async function enviarReporteCompleto() {
        const nombre = document.getElementById('nombreEmp').value;
        const num = document.getElementById('idEmp').value;
        const correo = document.getElementById('correoEmp').value;
        const total = document.getElementById('totalHoras').innerText;

        if(!correo.toLowerCase().endsWith('@cap.edu.mx')) return alert("Usa tu correo institucional");
        if(!nombre || !num) return alert("Falta nombre o número de empleado");

        // Recopilar filas
        let actividades = [];
        document.querySelectorAll('#cuerpoTabla tr').forEach(fila => {
            const fecha = fila.querySelector('.row-fecha').value;
            const hrs = fila.querySelector('.row-horas').value;
            const act = fila.querySelector('.row-act').value;
            if(fecha && hrs) actividades.push({ fecha, hrs, act });
        });

        if(actividades.length === 0) return alert("Agrega al menos una actividad");

        try {
            await db.collection("reportes_consolidados").add({
                nombre, num, correo, total, actividades,
                fechaEnvio: new Date().toISOString()
            });
            alert("✅ Reporte de quincena enviado con éxito.");
            location.reload();
        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    function accesoSupervisor() {
        const p = prompt("Clave:");
        if(p === "admin123") {
            document.getElementById('view-admin').classList.remove('hidden');
            cargarAdmin();
        }
    }

    async function cargarAdmin() {
        const snap = await db.collection("reportes_consolidados").get();
        const div = document.getElementById('lista-reportes');
        div.innerHTML = "";
        snap.forEach(doc => {
            const r = doc.data();
            div.innerHTML += `
                <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
                    <strong>${r.nombre} (${r.num})</strong> - Total: ${r.total} hrs<br>
                    <button onclick="copiarAlPortapapeles('${r.nombre}', '${r.num}', ${JSON.stringify(r.actividades).replace(/"/g, '&quot;')}, '${r.total}')">Copiar para Correo</button>
                </div>
            `;
        });
    }

    function copiarAlPortapapeles(nombre, id, acts, total) {
        let txt = `Nombre: ${nombre}\tNo. empleado: ${id}\nFecha\tHoras\tActividad\n`;
        acts.forEach(a => {
            txt += `${a.fecha}\t${a.hrs}\t${a.act}\n`;
        });
        txt += `TOTAL\t${total}`;
        navigator.clipboard.writeText(txt);
        alert("Copiado para pegar en Outlook.");
    }
</script>
</body>
</html>
