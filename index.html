<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Horas - Mantenimiento CAP</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <style>
        :root { --cap-blue: #003366; --cap-gold: #c5a059; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 950px; margin: auto; }
        .header-table, .main-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .header-table td, .main-table th, .main-table td { border: 1px solid #000; padding: 8px; }
        .bg-gray { background: #f8f9fa; font-weight: bold; }
        input, select { width: 100%; border: none; outline: none; background: transparent; font-size: 1rem; }
        .btn { padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; margin: 5px 0; width: 100%; }
        .btn-add { background: #28a745; width: auto; }
        .btn-send { background: var(--cap-blue); font-size: 1.1rem; }
        .hidden { display: none; }
        .admin-entry { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-left: 5px solid var(--cap-blue); }
    </style>
</head>
<body>

<div class="card" id="user-view">
    <h2 style="text-align:center; color: var(--cap-blue);">Reporte de Horas Adicionales</h2>
    <table class="header-table">
        <tr>
            <td class="bg-gray">Nombre:</td>
            <td><input type="text" id="nombreEmp" placeholder="Nombre completo"></td>
            <td class="bg-gray">No. Empleado:</td>
            <td><input type="text" id="idEmp" placeholder="P000"></td>
        </tr>
        <tr>
            <td class="bg-gray">Área:</td>
            <td>
                <select id="areaEmp">
                    <option value="">-- Seleccionar Área --</option>
                    <option value="Primaria">Primaria</option>
                    <option value="Secundaria">Secundaria</option>
                    <option value="Preparatoria">Preparatoria</option>
                    <option value="Oficios">Oficios</option>
                    <option value="Electricidad">Electricidad</option>
                    <option value="Jardineria">Jardineria</option>
                    <option value="Carpinteria">Carpinteria</option>
                </select>
            </td>
            <td class="bg-gray">Correo:</td>
            <td><input type="email" id="correoEmp" placeholder="@cap.edu.mx"></td>
        </tr>
    </table>

    <table class="main-table">
        <thead>
            <tr class="bg-gray">
                <th>Fecha</th>
                <th>Hrs</th>
                <th>Actividad realizada</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <tr>
                <td><input type="date" class="row-fecha"></td>
                <td><input type="number" class="row-horas" oninput="calcularTotal()" step="0.5"></td>
                <td><input type="text" class="row-act"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="bg-gray">
                <td>TOTAL HORAS:</td>
                <td id="totalHoras">0</td>
                <td></td>
            </tr>
        </tfoot>
    </table>
    <button class="btn btn-add" onclick="agregarFila()">+ Añadir fila</button>
    <button class="btn btn-send" onclick="enviarReporte()">ENVIAR REPORTE</button>
    <p style="text-align:center;"><a href="#" onclick="toggleView('login-view')" style="color:#666; font-size:0.8rem;">Acceso Supervisores</a></p>
</div>

<div id="login-view" class="card hidden">
    <h3>Login Supervisor</h3>
    <input type="email" id="loginEmail" placeholder="Correo @cap.edu.mx">
    <input type="password" id="loginPass" placeholder="Contraseña">
    <button class="btn btn-send" onclick="loginSupervisor()">Entrar al Panel</button>
    <button class="btn" style="background:#6c757d" onclick="toggleView('user-view')">Volver</button>
</div>

<div id="admin-view" class="card hidden">
    <h3 id="tituloAdmin">Panel de Supervisor</h3>
    <div id="lista-reportes">Cargando reportes de tu área...</div>
    <button class="btn" style="background:#dc3545" onclick="logout()">Cerrar Sesión</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA8kdp8RqrgCPiCCpAQw3Zp06-zLtHsIdU",
        authDomain: "horasadicionales-seccap.firebaseapp.com",
        projectId: "horasadicionales-seccap",
        storageBucket: "horasadicionales-seccap.firebasestorage.app",
        messagingSenderId: "775098466986",
        appId: "1:775098466986:web:5eda0508046d1dbf2086d3",
        measurementId: "G-PNZE1CNG8D"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Mapeo de correos a áreas (Configura aquí tus supervisores)
    const supervisoresAreas = {
        "hector.aguilar@cap.edu.mx": "Oficios",
        "supervisor.jardin@cap.edu.mx": "Jardineria",
        "supervisor.prepa@cap.edu.mx": "Preparatoria"
        // Agrega los demás correos y sus áreas correspondientes
    };

    function agregarFila() {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td><input type="date" class="row-fecha"></td><td><input type="number" class="row-horas" oninput="calcularTotal()" step="0.5"></td><td><input type="text" class="row-act"></td>';
        document.getElementById('cuerpoTabla').appendChild(tr);
    }

    function calcularTotal() {
        let t = 0;
        document.querySelectorAll('.row-horas').forEach(i => t += parseFloat(i.value) || 0);
        document.getElementById('totalHoras').innerText = t;
    }

    function toggleView(viewId) {
        document.getElementById('user-view').classList.add('hidden');
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('admin-view').classList.add('hidden');
        document.getElementById(viewId).classList.remove('hidden');
    }

    async function enviarReporte() {
        const area = document.getElementById('areaEmp').value;
        const nombre = document.getElementById('nombreEmp').value;
        const correo = document.getElementById('correoEmp').value;
        if(!area || !nombre || !correo.endsWith('@cap.edu.mx')) return alert("Datos incompletos o correo inválido");

        let filas = [];
        document.querySelectorAll('#cuerpoTabla tr').forEach(f => {
            const fecha = f.querySelector('.row-fecha').value;
            const hrs = f.querySelector('.row-horas').value;
            const act = f.querySelector('.row-act').value;
            if(fecha && hrs) filas.push({fecha, hrs, act});
        });

        try {
            await db.collection("reportes_finales").add({
                nombre, area, id: document.getElementById('idEmp').value,
                total: document.getElementById('totalHoras').innerText,
                actividades: filas,
                fechaEnvio: new Date().toISOString()
            });
            alert("✅ Reporte enviado al supervisor de " + area);
            location.reload();
        } catch(e) { alert("Error al enviar"); }
    }

    async function loginSupervisor() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        try {
            await auth.signInWithEmailAndPassword(email, pass);
            const areaAsignada = supervisoresAreas[email];
            if(!areaAsignada) {
                alert("Usuario no autorizado para áreas.");
                auth.signOut();
                return;
            }
            document.getElementById('tituloAdmin').innerText = "Panel: " + areaAsignada;
            toggleView('admin-view');
            cargarDatosFiltrados(areaAsignada);
        } catch(e) { alert("Correo o contraseña incorrectos"); }
    }

    async function cargarDatosFiltrados(area) {
        const snap = await db.collection("reportes_finales").where("area", "==", area).get();
        const contenedor = document.getElementById('lista-reportes');
        contenedor.innerHTML = "";
        if(snap.empty) contenedor.innerHTML = "No hay reportes nuevos en tu área.";
        snap.forEach(doc => {
            const r = doc.data();
            contenedor.innerHTML += `
                <div class="admin-entry">
                    <strong>${r.nombre}</strong> - ${r.total} hrs<br>
                    <button class="btn btn-add" style="padding:5px; font-size:0.7rem;" onclick="copiarEmail('${r.nombre}', '${r.area}', ${JSON.stringify(r.actividades).replace(/"/g, '&quot;')}, '${r.total}')">Copiar para Outlook</button>
                </div>`;
        });
    }

    function copiarEmail(n, ar, acts, t) {
        let txt = `REPORTE DE HORAS - ÁREA: ${ar}\nNombre: ${n}\nFecha\tHoras\tActividad\n`;
        acts.forEach(a => txt += `${a.fecha}\t${a.hrs}\t${a.act}\n`);
        txt += `TOTAL\t${t}`;
        navigator.clipboard.writeText(txt);
        alert("Copiado al portapapeles.");
    }

    function logout() {
        auth.signOut();
        location.reload();
    }
</script>
</body>
</html>
